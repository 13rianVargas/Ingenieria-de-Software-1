<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radicar PQRS - SuperMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D81B60',
                        secondary: '#CDDC39',
                        tertiary: '#4DB6AC',
                        accent: '#6A1B9A',
                        danger: '#C62828'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f3f4f6; }
        .mobile-container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="mobile-container flex flex-col">
        
        <!-- App Bar -->
        <div class="bg-primary text-white p-4 flex items-center shadow-md sticky top-0 z-10">
            <button class="mr-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <h1 class="text-xl font-bold">Nueva PQRS</h1>
        </div>

        <div class="p-5 space-y-6">
            <!-- Informativo -->
            <div class="bg-blue-50 border-l-4 border-tertiary p-4 rounded text-sm text-gray-700">
                Al enviar este formulario, si no tienes cuenta, te crearemos una automáticamente para hacer seguimiento.
            </div>

            <form class="space-y-5">
                <!-- Sección Datos Personales -->
                <div>
                    <h2 class="text-accent font-bold mb-3 border-b pb-1">Datos Personales</h2>
                    
                    <div class="space-y-4">
                        <div class="flex gap-3">
                            <div class="w-1/3">
                                <label class="block text-xs text-gray-600 mb-1">Tipo ID</label>
                                <select class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm bg-white">
                                    <option>CC</option>
                                    <option>CE</option>
                                    <option>NIT</option>
                                </select>
                            </div>
                            <div class="w-2/3">
                                <label class="block text-xs text-gray-600 mb-1">Número ID</label>
                                <input type="number" class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Nombre Completo</label>
                            <input type="text" class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Correo Electrónico</label>
                            <input type="email" class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Teléfono Móvil</label>
                            <input type="tel" class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm">
                        </div>
                    </div>
                </div>

                <!-- Sección PQRS -->
                <div class="pt-2">
                    <h2 class="text-accent font-bold mb-3 border-b pb-1">Detalle de la Solicitud</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Tipo de Radicado</label>
                            <select class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm bg-white">
                                <option>Seleccione...</option>
                                <option>Petición</option>
                                <option>Queja</option>
                                <option>Reclamo</option>
                                <option>Sugerencia</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Comentarios</label>
                            <textarea rows="4" class="w-full p-2 border border-gray-300 rounded focus:border-tertiary outline-none text-sm resize-none" placeholder="Describa el motivo de su solicitud aquí..."></textarea>
                        </div>

                        <!-- Subida PDF -->
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Anexo (Opcional - Solo PDF)</label>
                            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md bg-gray-50 hover:bg-gray-100 transition cursor-pointer">
                                <div class="space-y-1 text-center">
                                    <svg class="mx-auto h-10 w-10 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    <div class="flex text-sm text-gray-600 justify-center">
                                        <span class="relative cursor-pointer rounded-md font-medium text-tertiary hover:text-accent focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-tertiary">
                                            <span>Subir un archivo</span>
                                            <input id="file-upload" name="file-upload" type="file" class="sr-only" accept="application/pdf">
                                        </span>
                                    </div>
                                    <p class="text-xs text-gray-500">PDF hasta 5MB</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pt-6">
                    <button type="button" class="w-full bg-primary text-white font-bold py-3 rounded-lg shadow-md hover:bg-opacity-90 transition active:scale-95 text-lg">
                        Radicar Solicitud
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
