<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Gestor - SuperMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D81B60',
                        secondary: '#CDDC39',
                        tertiary: '#4DB6AC',
                        accent: '#6A1B9A',
                        danger: '#C62828'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex">
            <!-- Columna Izquierda (Decorativa) -->
            <div class="hidden md:flex md:w-1/2 bg-accent flex-col justify-center items-center p-12 text-white relative overflow-hidden">
                <div class="absolute inset-0 opacity-20">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full">
                        <polygon fill="white" points="0,100 100,0 100,100"/>
                    </svg>
                </div>
                <div class="relative z-10 text-center">
                    <div class="w-24 h-24 bg-white rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                        <svg class="w-12 h-12 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <h1 class="text-4xl font-bold mb-4">Gestión PQRS</h1>
                    <p class="text-lg text-gray-200">Panel administrativo de SuperMarket para el control y respuesta de solicitudes.</p>
                </div>
            </div>

            <!-- Columna Derecha (Formulario) -->
            <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Bienvenido de nuevo</h2>
                    <p class="text-gray-500">Ingresa tus credenciales de Gestor para continuar.</p>
                </div>

                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario Corporativo</label>
                        <input type="text" placeholder="usuario@supermarket.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary outline-none transition">
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="rounded border-gray-300 text-primary shadow-sm focus:ring-primary">
                            <span class="ml-2 text-sm text-gray-600">Recordarme</span>
                        </label>
                        <a href="#" class="text-sm font-medium text-tertiary hover:text-primary transition">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="button" class="w-full bg-primary text-white font-bold py-3 rounded-lg shadow-md hover:bg-opacity-90 transition active:scale-95 text-lg">
                        Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
