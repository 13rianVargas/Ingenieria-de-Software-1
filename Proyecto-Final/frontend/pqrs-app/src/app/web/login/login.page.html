<ion-content [fullscreen]="true" style="--background: #f3f4f6;">

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex">
            <!-- Columna Izquierda (Decorativa) -->
            <div class="hidden md:flex md:w-1/2 bg-accent flex-col justify-center items-center p-12 text-white relative overflow-hidden">
                <div class="absolute inset-0 opacity-20">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full" width="24" height="24">
                        <polygon fill="white" points="0,100 100,0 100,100"/>
                    </svg>
                </div>
                <div class="relative z-10 text-center">
                    <div class="w-24 h-24 bg-white rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                        <svg class="w-12 h-12 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <h1 class="text-4xl font-bold mb-4">Gestión PQRS</h1>
                    <p class="text-lg text-gray-200">Panel administrativo de SuperMarket para el control y respuesta de solicitudes.</p>
                </div>
            </div>

            <!-- Columna Derecha (Formulario) -->
            <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Bienvenido de nuevo</h2>
                    <p class="text-gray-500">Ingresa tus credenciales de Gestor para continuar.</p>
                </div>

                <!-- Error Message -->
                <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                        </svg>
                        <p class="text-red-700 text-sm">{{ errorMessage }}</p>
                    </div>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">

                    <!-- Email Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                        <input
                            type="email"
                            formControlName="email"
                            placeholder="Ej: gestor@demo.com"
                            class="w-full px-4 py-3 border rounded-lg outline-none transition"
                            [class.border-red-300]="hasError('email')"
                            [class.border-gray-300]="!hasError('email')"
                            [class.focus:ring-red-500]="hasError('email')"
                            [class.focus:ring-tertiary]="!hasError('email')"
                            [class.focus:border-tertiary]="!hasError('email')"
                            [class.focus:border-red-500]="hasError('email')"
                            [class.focus:ring-2]="true"
                            [disabled]="isLoading"
                        >

                        <!-- Error Message -->
                        <div *ngIf="hasError('email')" class="mt-1 text-sm text-red-600">
                            {{ getErrorMessage('email') }}
                        </div>
                    </div>

                    <!-- Clave Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input
                            type="password"
                            formControlName="clave"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 border rounded-lg outline-none transition"
                            [class.border-red-300]="hasError('clave')"
                            [class.border-gray-300]="!hasError('clave')"
                            [class.focus:ring-red-500]="hasError('clave')"
                            [class.focus:ring-tertiary]="!hasError('clave')"
                            [class.focus:border-tertiary]="!hasError('clave')"
                            [class.focus:border-red-500]="hasError('clave')"
                            [class.focus:ring-2]="true"
                            [disabled]="isLoading"
                        >

                        <!-- Error Message -->
                        <div *ngIf="hasError('clave')" class="mt-1 text-sm text-red-600">
                            {{ getErrorMessage('clave') }}
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="w-full bg-primary text-white font-bold py-3 rounded-lg shadow-md transition active:scale-95 text-lg flex items-center justify-center"
                        [class.hover:bg-opacity-90]="!isLoading"
                        [class.bg-gray-400]="isLoading"
                        [disabled]="isLoading || loginForm.invalid"
                    >
                        <!-- Loading Spinner -->
                        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>

                        {{ isLoading ? 'Iniciando Sesión...' : 'Iniciar Sesión' }}
                    </button>
                </form>
            </div>
        </div>
    </div>

</ion-content>
