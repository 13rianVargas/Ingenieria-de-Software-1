<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mobile/historial"></ion-back-button>
    </ion-buttons>
    <ion-title>Radicar PQRS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
    <p class="text-red-700 text-sm">{{ errorMessage }}</p>
  </div>

  <form [formGroup]="radicacionForm" (ngSubmit)="onSubmit()">
    
    <ion-item class="mb-4 rounded-lg border">
      <ion-select formControlName="tipo" label="Tipo de Radicado" label-placement="floating">
        <ion-select-option value="PETICION">Petición</ion-select-option>
        <ion-select-option value="QUEJA">Queja</ion-select-option>
        <ion-select-option value="RECLAMO">Reclamo</ion-select-option>
        <ion-select-option value="SUGERENCIA">Sugerencia</ion-select-option>
      </ion-select>
    </ion-item>
    <div *ngIf="radicacionForm.get('tipo')?.invalid && radicacionForm.get('tipo')?.touched" class="text-red-600 text-sm mb-4 px-2">
      Seleccione el tipo de radicado.
    </div>

    <ion-item class="mb-4 rounded-lg border">
      <ion-input formControlName="asunto" label="Asunto" label-placement="floating" placeholder="Resumen breve"></ion-input>
    </ion-item>
    <div *ngIf="radicacionForm.get('asunto')?.invalid && radicacionForm.get('asunto')?.touched" class="text-red-600 text-sm mb-4 px-2">
      El asunto debe tener entre 5 y 200 caracteres.
    </div>

    <ion-item class="mb-4 rounded-lg border">
      <ion-textarea formControlName="descripcion" label="Descripción" label-placement="floating" placeholder="Detalle su solicitud..." [autoGrow]="true" rows="4"></ion-textarea>
    </ion-item>
    <div *ngIf="radicacionForm.get('descripcion')?.invalid && radicacionForm.get('descripcion')?.touched" class="text-red-600 text-sm mb-4 px-2">
      La descripción debe tener al menos 20 caracteres.
    </div>

    <div class="mb-6 p-4 bg-gray-50 rounded-lg border">
      <label class="block text-sm font-medium text-gray-700 mb-2">Anexo (Opcional - Solo PDF max 5MB)</label>
      
      <input type="file" accept="application/pdf" (change)="onArchivo($event)" class="w-full text-sm text-gray-500
        file:mr-4 file:py-2 file:px-4
        file:rounded-full file:border-0
        file:text-sm file:font-semibold
        file:bg-primary file:text-white
        hover:file:bg-blue-600
      "/>
    </div>

    <ion-button expand="block" type="submit" [disabled]="radicacionForm.invalid || isLoading" class="mt-4 font-bold">
      <ion-spinner *ngIf="isLoading" name="crescent" class="mr-2"></ion-spinner>
      {{ isLoading ? 'Radicando...' : 'Radicar PQRS' }}
    </ion-button>
    
  </form>
</ion-content>
