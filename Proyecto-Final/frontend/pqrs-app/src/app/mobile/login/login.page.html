<ion-content [fullscreen]="true" style="--background: #f3f4f6;">

    <div class="mobile-container flex flex-col justify-center px-6">

        <!-- Header / Logo Area -->
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-accent rounded-full mx-auto flex items-center justify-center mb-4 shadow-lg">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-accent">SuperMarket</h1>
            <p class="text-gray-500 mt-2">Portal de PQRS</p>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
                <p class="text-red-700 text-sm">{{ errorMessage }}</p>
            </div>
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
            <div class="flex items-center">
                <svg class="w-5 h-5 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
                <p class="text-green-700 text-sm font-medium">{{ successMessage }}</p>
            </div>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">

            <!-- Email Field -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input
                    type="email"
                    formControlName="email"
                    placeholder="ejemplo@demo.com"
                    class="w-full px-4 py-3 border rounded-lg outline-none transition"
                    [class.border-red-300]="hasError('email')"
                    [class.border-gray-300]="!hasError('email')"
                    [class.focus:ring-red-500]="hasError('email')"
                    [class.focus:ring-tertiary]="!hasError('email')"
                    [class.focus:border-tertiary]="!hasError('email')"
                    [class.focus:border-red-500]="hasError('email')"
                    [class.focus:ring-2]="true"
                    [disabled]="isLoading"
                >

                <!-- Error Message -->
                <div *ngIf="hasError('email')" class="mt-1 text-sm text-red-600">
                    {{ getErrorMessage('email') }}
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input
                    type="password"
                    formControlName="clave"
                    placeholder="••••••••"
                    class="w-full px-4 py-3 border rounded-lg outline-none transition"
                    [class.border-red-300]="hasError('clave')"
                    [class.border-gray-300]="!hasError('clave')"
                    [class.focus:ring-red-500]="hasError('clave')"
                    [class.focus:ring-tertiary]="!hasError('clave')"
                    [class.focus:border-tertiary]="!hasError('clave')"
                    [class.focus:border-red-500]="hasError('clave')"
                    [class.focus:ring-2]="true"
                    [disabled]="isLoading"
                >

                <!-- Error Message -->
                <div *ngIf="hasError('clave')" class="mt-1 text-sm text-red-600">
                    {{ getErrorMessage('clave') }}
                </div>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-primary text-white font-bold py-3 rounded-lg shadow-md transition active:scale-95 flex items-center justify-center"
                [class.hover:bg-opacity-90]="!isLoading"
                [class.bg-gray-400]="isLoading"
                [disabled]="isLoading || loginForm.invalid"
            >
                <!-- Loading Spinner -->
                <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>

                {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
            </button>
        </form>

        <!-- Radicar Nueva PQRS Section -->
        <div class="mt-8 text-center border-t pt-6 border-gray-200">
            <p class="text-sm text-gray-600 mb-4">¿No tienes cuenta o eres usuario nuevo?</p>
            <button
                type="button"
                (click)="onRadicarNueva()"
                class="w-full bg-white border-2 border-primary text-primary font-bold py-3 rounded-lg shadow-sm hover:bg-gray-50 transition active:scale-95"
                [disabled]="isLoading"
            >
                Radicar PQRS Nueva
            </button>
        </div>

    </div>

</ion-content>
