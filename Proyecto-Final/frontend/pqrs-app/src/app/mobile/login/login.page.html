
<ion-content [fullscreen]="true" style="--background: #f3f4f6;">

    <div class="mobile-container flex flex-col justify-center px-6">
        
        <!-- Header / Logo Area -->
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-accent rounded-full mx-auto flex items-center justify-center mb-4 shadow-lg">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-accent">SuperMarket</h1>
            <p class="text-gray-500 mt-2">Portal de PQRS</p>
        </div>

        <!-- Login Form -->
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Número de Identificación</label>
                <input type="text" placeholder="Ej: 1010202030" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-tertiary focus:border-tertiary outline-none transition">
            </div>

            <button type="button" class="w-full bg-primary text-white font-bold py-3 rounded-lg shadow-md hover:bg-opacity-90 transition active:scale-95">
                Ingresar
            </button>
        </form>

        <div class="mt-8 text-center border-t pt-6 border-gray-200">
            <p class="text-sm text-gray-600 mb-4">¿No tienes cuenta o eres usuario nuevo?</p>
            <button type="button" class="w-full bg-white border-2 border-primary text-primary font-bold py-3 rounded-lg shadow-sm hover:bg-gray-50 transition active:scale-95">
                Radicar PQRS Nueva
            </button>
        </div>

    </div>

</ion-content>
