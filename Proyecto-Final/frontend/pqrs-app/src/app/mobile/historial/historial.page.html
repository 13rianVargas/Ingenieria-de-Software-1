<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mis Radicados</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="recargar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-searchbar placeholder="Buscar por radicado" [(ngModel)]="filtroRadicado" (ionInput)="buscar()"></ion-searchbar>

  <div *ngIf="loading" class="text-center p-4">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!loading && radicados.length === 0" class="text-center p-8 text-gray-500">
    <p>Aún no has radicado PQRS.</p>
    <ion-button routerLink="/mobile/radicar" class="mt-4">Radicar Nueva PQRS</ion-button>
  </div>

  <ion-list *ngIf="!loading && radicados.length > 0">
    <ion-item *ngFor="let p of radicados" [routerLink]="['/mobile/detalle', p.id]" detail>
      <ion-label>
        <h2 class="font-bold text-lg">{{ p.radicado }}</h2>
        <p>{{ p.tipo | titlecase }} · {{ p.fechaRadicado | date:'short' }}</p>
        <ion-badge color="primary">{{ p.estado }}</ion-badge>
      </ion-label>
    </ion-item>
  </ion-list>
  
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="!loading && radicados.length > 0">
    <ion-fab-button routerLink="/mobile/radicar">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
