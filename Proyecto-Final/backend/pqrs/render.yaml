services:
  - type: web
    name: pqrs-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false          # pooled Neon — set manual en dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: R2_ENABLED
        value: "true"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: pqrs-anexos
      - key: R2_PUBLIC_BASE
        sync: false
