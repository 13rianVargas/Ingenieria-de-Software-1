spring:
  application:
    name: pqrs
  # DataSource construido por DataSourceConfig.java a partir de DATABASE_URL bare
  # (formato Heroku/Neon `postgresql://user:pass@host/db?params`).
  # No definir spring.datasource.url aqui — colisiona con la auto-config.
  jpa:
    hibernate:
      # `none` porque Flyway (CI db-migrate.yml) es la unica fuente de verdad del schema.
      # `validate` falla por incompatibilidad Hibernate 6 + SERIAL (espera bigint para Integer @GeneratedValue).
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
      hibernate.hbm2ddl.auto: none
    open-in-view: false
  flyway:
    enabled: false   # CI (db-migrate.yml) es la unica fuente de verdad
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:dev-secret-must-be-overridden-32chars-min}
  expiration-ms: 28800000   # 8 horas

logging:
  level:
    co.edu.konrad: INFO
    org.springframework.security: WARN
