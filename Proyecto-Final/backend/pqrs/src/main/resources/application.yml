spring:
  application:
    name: pqrs
  # DataSource construido por DataSourceConfig.java a partir de DATABASE_URL bare
  # (formato Heroku/Neon `postgresql://user:pass@host/db?params`).
  # No definir spring.datasource.url aqui — colisiona con la auto-config.
  jpa:
    hibernate:
      # `none` porque Flyway (CI db-migrate.yml) es la unica fuente de verdad del schema.
      # `validate` falla por incompatibilidad Hibernate 6 + SERIAL (espera bigint para Integer @GeneratedValue).
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
      hibernate.hbm2ddl.auto: none
    open-in-view: false
  flyway:
    enabled: false   # CI (db-migrate.yml) es la unica fuente de verdad
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}          # vacio = worker de correos deshabilitado
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:dev-secret-must-be-overridden-32chars-min}
  expiration-ms: 28800000   # 8 horas

correo:
  from: ${MAIL_FROM:${MAIL_USERNAME:}}   # remitente; por defecto el usuario SMTP
  from-nombre: ${MAIL_FROM_NOMBRE:PQRS SuperMarket Konrad}

r2:
  enabled: ${R2_ENABLED:false}         # true cuando haya credenciales Cloudflare R2
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:pqrs-anexos}
  public-base: ${R2_PUBLIC_BASE:}

logging:
  level:
    co.edu.konrad: INFO
    org.springframework.security: WARN
